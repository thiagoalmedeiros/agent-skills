<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic SDLC — World Map</title>
<style>
  :root {
    --bg: #0b0d14; --panel: #141826; --panel-2: #1b2032; --border: #2c3350;
    --text: #e8ecf8; --muted: #8b94ad; --gold: #ffd75f; --teal: #5ee6c2;
    --pink: #ff5f87; --blue: #7c9cff; --purple: #c792ea; --orange: #ff9e64;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
    background:
      radial-gradient(1200px 500px at 50% -10%, #1b2240 0%, transparent 60%),
      radial-gradient(900px 400px at 90% 110%, #241b3a 0%, transparent 55%),
      var(--bg);
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  /* CRT scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px clamp(14px, 4vw, 20px) 80px; }

  /* HUD header */
  .hud { text-align: center; margin-bottom: 26px; }
  .hud h1 {
    margin: 0; font-size: clamp(22px, 4.5vw, 38px); letter-spacing: .18em;
    text-transform: uppercase; color: var(--gold);
    text-shadow: 0 0 14px rgba(255,215,95,.45), 3px 3px 0 #3a2e00;
  }
  .hud .press {
    margin-top: 6px; color: var(--teal); font-size: 12px; letter-spacing: .3em;
    text-transform: uppercase;
  }
  .hud .press::after { content: "▮"; margin-left: 6px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hudbar {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px;
  }
  .hudstat {
    background: var(--panel); border: 2px solid var(--border); padding: 8px 16px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45); min-width: 96px;
  }
  .hudstat b { display: block; font-size: 20px; color: var(--teal); }
  .hudstat span { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  /* search */
  .searchrow { display: flex; justify-content: center; margin: 22px 0 6px; }
  #q {
    width: min(520px, 100%); padding: 10px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--panel); border: 2px solid var(--border); outline: none;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45); -webkit-appearance: none; appearance: none;
  }
  #q:focus { border-color: var(--teal); }
  #q::placeholder { color: var(--muted); }

  .screen-title {
    margin: 26px 0 4px; font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted); text-align: center;
  }

  /* world map grid */
  .worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 14px; margin-top: 16px; }
  .world {
    position: relative; background: var(--panel); border: 2px solid var(--wc, var(--border));
    box-shadow: 5px 5px 0 rgba(0,0,0,.5); padding: 13px; cursor: pointer;
    transition: transform .08s steps(2), box-shadow .08s steps(2);
    display: flex; flex-direction: column; gap: 8px;
  }
  .world:hover, .world:focus-visible {
    transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,.5);
    outline: none; background: var(--panel-2);
  }
  .world .rowtop { display: flex; align-items: center; gap: 10px; }
  .world .sprite {
    font-size: 20px; width: 38px; height: 38px; display: grid; place-items: center;
    background: var(--panel-2); border: 2px solid var(--wc, var(--border));
    filter: drop-shadow(0 0 6px var(--wc));
  }
  .world h2 { margin: 0; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--wc, var(--text)); }
  .world .lv { font-size: 9px; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }
  .world p.quest { margin: 0; color: var(--muted); font-size: 11.5px; flex: 1; }
  .bar { display: flex; gap: 3px; }
  .bar i { width: 14px; height: 8px; background: var(--panel-2); border: 1px solid var(--border); }
  .bar i.on { background: var(--wc, var(--teal)); border-color: var(--wc, var(--teal)); box-shadow: 0 0 5px var(--wc); }
  .world .enter { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--wc, var(--teal)); }
  .world .ptag {
    position: absolute; top: -10px; right: 10px; font-size: 8px; letter-spacing: .12em;
    text-transform: uppercase; background: var(--bg); border: 2px solid var(--wc, var(--border));
    color: var(--wc, var(--muted)); padding: 2px 7px;
  }

  /* world detail / roster */
  .back {
    display: inline-block; margin-top: 16px; background: var(--panel); color: var(--teal);
    border: 2px solid var(--border); padding: 8px 14px; cursor: pointer; font: inherit;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45);
  }
  .back:hover { border-color: var(--teal); }
  .zonehead { text-align: center; margin: 18px 0 6px; }
  .zonehead .sprite { font-size: 44px; filter: drop-shadow(0 0 10px var(--wc)); }
  .zonehead h2 { margin: 6px 0 2px; letter-spacing: .16em; text-transform: uppercase; color: var(--wc, var(--gold)); }
  .zonehead p { margin: 0; color: var(--muted); font-size: 13px; }
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px; margin-top: 18px; }
  .ability {
    background: var(--panel); border: 2px solid var(--border);
    box-shadow: 4px 4px 0 rgba(0,0,0,.5); padding: 11px 13px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .ability .rowtop { display: flex; align-items: center; gap: 8px; }
  .ability .icon {
    font-size: 15px; width: 30px; height: 30px; display: grid; place-items: center;
    background: var(--panel-2); border: 2px solid var(--border); flex: none;
  }
  .ability h3 { margin: 0; font-size: 12px; letter-spacing: .04em; color: var(--text); word-break: break-word; }
  .ability .ver {
    font-size: 8px; color: var(--bg); background: var(--gold); padding: 1px 5px;
    letter-spacing: .1em; font-weight: 700;
  }
  .ability p { margin: 0; color: var(--muted); font-size: 11px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .ability .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tagchip {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border); padding: 2px 7px; cursor: pointer;
  }
  .tagchip:hover { color: var(--teal); border-color: var(--teal); }
  .ability a.scroll { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--blue); text-decoration: none; margin-left: auto; }
  .ability a.scroll:hover { color: var(--teal); }

  .empty { text-align: center; color: var(--muted); padding: 50px 0; letter-spacing: .1em; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 56px; letter-spacing: .04em; }
  footer code { color: var(--teal); }
  footer a { color: var(--blue); }

  /* implementation path (ordered pipeline) */
  .pipeline {
    display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center;
    gap: 10px; margin-top: 16px;
  }
  .pipeline .world { flex: 1 1 150px; max-width: 190px; }
  .pipeline .arrow {
    align-self: center; flex: 0 0 auto; color: var(--teal); font-size: 22px;
    line-height: 1; text-shadow: 0 0 8px var(--teal);
  }
  .shelf-title { margin-top: 30px; }
  @media (max-width: 640px) {
    .pipeline { flex-direction: column; align-items: center; }
    .pipeline .world { max-width: 100%; width: 100%; }
    .pipeline .arrow { transform: rotate(90deg); }
  }
</style>
</head>

<script>
const DATA = {"version":"1.4.1","generatedAt":"","skills":[{"id":"angular-components","name":"angular-components","description":"Standards and boilerplate for Angular components (Angular v20, TypeScript strict, DDD architecture) — signal inputs/outputs, inject()-based DI, OnPush, and correct component/container/page layout. USE FOR: creating new components, auditing existing components for standards compliance, and questions about component structure, dependency injection, services, or routing. DO NOT USE FOR: state management patterns (use angular-state), template and styling conventions (use angular-ui), or non-Angular tasks.","version":"1.0.0","argumentHint":"Optional: component name, file path, or feature area to generate or audit","path":"skills/angular-components/SKILL.md","areas":["build"]},{"id":"angular-state","name":"angular-state","description":"Standards for Angular state management using Signals and RxJS (Angular v20) — signal-first state, read-only public surfaces, and a legacy modernization checklist. USE FOR: writing signal-based state, reviewing or migrating legacy @Input/@Output/BehaviorSubject patterns, and resolving questions about reactive state design. DO NOT USE FOR: component boilerplate (use angular-components), template or styling conventions (use angular-ui), or non-Angular tasks.","version":"1.0.0","argumentHint":"Optional: file path or feature area to audit for state management patterns","path":"skills/angular-state/SKILL.md","areas":["build"]},{"id":"angular-ui","name":"angular-ui","description":"UI conventions for Angular templates and styling (Angular v20, Tailwind CSS, SCSS) — native control flow, Tailwind-first layout, and scoped SCSS theming. USE FOR: writing Angular templates, applying native control flow (@if/@for/@switch), styling components, and reviewing UI code for convention compliance. DO NOT USE FOR: component boilerplate and DI (use angular-components), state management logic (use angular-state), or non-UI tasks.","version":"1.0.0","argumentHint":"Optional: file path or component name to audit","path":"skills/angular-ui/SKILL.md","areas":["build"]},{"id":"browser-testing","name":"browser-testing","description":"Verify browser-facing changes by actually opening a real browser and driving it — navigating, clicking, typing, watching the screen — the way a human tester would, instead of guessing from static code or relying only on structured API output. The mechanism that opens the browser is detected from whatever the current environment provides (a configured browser-automation tool, the project's own e2e tooling, an IDE-integrated preview, or the OS browser) rather than any one specific tool. USE FOR: debugging UI/browser issues, verifying a browser-facing fix actually works, reproducing a bug interactively, or screenshot-based visual verification. DO NOT USE FOR: backend-only changes, CLI tools, or any code that never runs in a browser (use thomas for that verification instead).","version":"2.0.0","argumentHint":"Optional: URL or page to test (defaults to the project's local dev server)","path":"skills/browser-testing/SKILL.md","areas":["shelf"]},{"id":"code-reviewer","name":"code-reviewer","description":"Multi-axis code review, language- and framework-agnostic — correctness, readability, architecture/SOLID, security, and performance, layered with convention conformance, duplication detection, test quality, and strict comment hygiene (self-documenting code; over-commenting is a readability defect). USE FOR: reviewing a branch diff or local uncommitted changes before merge; assessing code health across dimensions; reviewing code written by yourself, another agent, or a human. DO NOT USE FOR: writing new features, planning work (use impl-strategy), or first-hand test execution (use thomas).","version":"1.1.0","argumentHint":"Optional: branch name (default, diffed against develop), or 'local' for uncommitted changes","path":"skills/code-reviewer/SKILL.md","areas":["review"]},{"id":"code-simplification","name":"code-simplification","description":"Reduces complexity in working code while preserving exact behavior, judged by whether a new teammate would understand the result faster than the original. USE FOR: cleaning up deeply nested logic, long functions, or unclear names after a feature works; consolidating duplicated logic; refactoring code written under time pressure; addressing readability feedback from review. DO NOT USE FOR: reviewing code health across correctness, security, and architecture (use code-reviewer), or code you don't yet understand — comprehend it first, simplify it second.","version":"1.0.0","argumentHint":"Optional: file or directory to scope the pass to (default: recently changed files)","path":"skills/code-simplification/SKILL.md","areas":["review"]},{"id":"devcontainer-setup","name":"devcontainer-setup","description":"Set up or review a polyglot-ready .devcontainer environment (Docker Compose + Dockerfile + devcontainer.json) built on the Microsoft devcontainers base images, for any project stack. USE FOR: creating a new .devcontainer for a project, or auditing an existing .devcontainer against the standard. DO NOT USE FOR: production Docker image authoring, Kubernetes/Compose deployment manifests, or CI pipeline configuration.","version":"1.0.0","argumentHint":"Optional: project stack hint (otherwise inferred from the repo); no arg audits an existing .devcontainer","path":"skills/devcontainer-setup/SKILL.md","areas":["shelf"]},{"id":"docs-sync","name":"docs-sync","description":"Keep the repo's agent/architecture docs (AGENTS.md, ARCHITECTURE.md, README.md, CLAUDE.md) and the knowledge base aligned with the actual code changes on a branch — plan-first and evidence-based. A diff is the trigger, but the analysis radius extends to related docs the diff does not show; detects drift, duplication, dead/outdated content, and contradictions, and suggests combining, moving, or reorganizing content. USE FOR: syncing docs after code changes, detecting doc drift, a pre-merge documentation check, or cross-checking the knowledge base and agent docs for contradictions or duplication a change exposes. DO NOT USE FOR: writing net-new documentation unrelated to a diff, rewriting docs wholesale, or applying structural changes (combine, move, delete, reorganize) without the user's confirmation.","version":"2.0.0","argumentHint":"Optional base branch (defaults to origin/main; a non-main base is the caller's responsibility to specify)","path":"skills/docs-sync/SKILL.md","areas":["ship"]},{"id":"dotnet-csharp-standard","name":"dotnet-csharp-standard","description":"Canonical .NET / C# coding standard (Microsoft Framework Design Guidelines, C# coding conventions, .NET runtime style, Roslyn analyzers, OWASP .NET) for authoring and reviewing C# — every finding cites the rule it violates. USE FOR: writing new C# code, reviewing existing C# code, enforcing project conventions, onboarding a .NET codebase, or reviewing a PR that adds/modifies C# source. DO NOT USE FOR: F#, VB.NET, or other CLR languages; ASP.NET/EF Core application architecture; or NuGet/dependency selection.","version":"1.0.0","argumentHint":"Path to a C# file, project, or solution to author, refactor, or review","path":"skills/dotnet-csharp-standard/SKILL.md","areas":["build"]},{"id":"graphify-setup","name":"graphify-setup","description":"Install and configure graphify so an AI coding assistant can navigate the codebase via a persistent knowledge graph — across Claude Code, Codex, and Copilot, with git hooks and optional devcontainer wiring. USE FOR: first-time graphify setup for a project, or auditing an existing graphify configuration for missing pieces. DO NOT USE FOR: general knowledge-graph theory, non-graphify tools, or building application features on top of the graph.","version":"1.0.0","argumentHint":"Optional: which AI platform(s) to configure (defaults to auto-detecting Claude Code / Codex / Copilot)","path":"skills/graphify-setup/SKILL.md","areas":["shelf"]},{"id":"grill-me","name":"grill-me","description":"Adversarially pressure-tests a decision, plan, belief, or design the user has ALREADY formed — one hard question at a time — until it either hardens or a fatal flaw surfaces. Refuses hand-waving, appeals to authority, and \"we'll-figure-it-out-later\" answers. USE FOR: \"grill me\", \"stress-test my thinking\", \"poke holes in this\", \"red-team my plan\", \"why might this be wrong\", \"am I fooling myself\". DO NOT USE FOR: extracting what the user wants from a vague request (that is cooperative intent-clarification), unambiguous mechanical tasks, or pure information lookups.","version":"1.0.0","argumentHint":"A decision, plan, belief, design, or claim to stress-test under adversarial interrogation","path":"skills/grill-me/SKILL.md","areas":["definition","shelf"]},{"id":"impl-strategy","name":"impl-strategy","description":"Create structured implementation plans with a fixed three-section output (What We Are Doing; How We Are Doing It / What Is Out of Scope; Tracking List), written as a plan folder that a later phase executes. USE FOR: planning refactors, migrations, feature delivery, technical execution plans, and persistent plan documents that guide a later implementation phase. DO NOT USE FOR: direct execution (this skill plans, it does not implement), ad-hoc code explanations, one-off tiny edits that need no planning, or broad product brainstorming with no concrete target.","version":"1.0.0","argumentHint":"Feature, route, or task to analyze and turn into an implementation plan","path":"skills/impl-strategy/SKILL.md","areas":["definition"]},{"id":"jira-fetch","name":"jira-fetch","description":"Fetch full Jira ticket details (description, comments, subtasks, linked issues) from a URL or issue key via the read-only REST API, and save them to a markdown file. Credentials are resolved from a lookup chain, never hard-coded. USE FOR: pulling a Jira ticket's full context from a URL or key (e.g. PROJ-123) for planning or implementation. DO NOT USE FOR: creating, updating, or transitioning Jira issues; Jira administration; or any write operation.","version":"1.0.0","argumentHint":"Jira ticket URL (e.g. https://your-org.atlassian.net/browse/PROJ-123)","path":"skills/jira-fetch/SKILL.md","areas":["definition"]},{"id":"lessons-learned","name":"lessons-learned","description":"Standalone lessons-learned log. Captures problems, mistakes, and non-obvious patterns discovered during a session into a `lessons.md` file at a caller-supplied location, with init / read / append modes. USE FOR: initializing, reading, or appending entries to a `lessons.md` log during any working session. DO NOT USE FOR: writing implementation plans (use impl-strategy), running code changes, or producing generic best-practice documents.","version":"1.0.0","argumentHint":"init <path> | read <path> | append <path> \"<short-title>\"","path":"skills/lessons-learned/SKILL.md","areas":["shelf"]},{"id":"merge-and-validate","name":"merge-and-validate","description":"Safely merges a branch into the current branch and validates the result against the project's Definition of Done, rolling back to the recorded pre-merge state on any failure. USE FOR: merging feature branches, release branches, or hotfixes while ensuring validation gates pass before finishing. DO NOT USE FOR: rebasing, cherry-picking, or resolving complex multi-branch merge strategies.","version":"1.0.0","argumentHint":"Branch name to merge into the current branch","path":"skills/merge-and-validate/SKILL.md","areas":["ship"]},{"id":"objective-advisor","name":"objective-advisor","description":"Turns the agent from a submissive assistant into an objective, high-critical-thinking advisor — targeting cognitive biases, calibrating its own certainty, and pressure-testing ideas without empty contrarianism or polite sycophancy. USE FOR: evaluating a query, proposal, decision, or document where you want unvarnished, bias-aware critique instead of validation. DO NOT USE FOR: interactive one-question-at-a-time interrogation of a formed decision (use grill-me), or tasks that need cooperative execution rather than critique.","version":"1.0.0","argumentHint":"A query, proposal, decision, or document to analyze under adversarial advisor guidelines","path":"skills/objective-advisor/SKILL.md","areas":["review"]},{"id":"open-knowledge","name":"open-knowledge","description":"Read, write, and maintain repository documentation under the Open Knowledge Format (OKF) v0.1 so the `knowledge-base/` stays human-readable, agent-parseable, and portable. USE FOR: editing or creating documentation in knowledge-base/, adding concepts, updating index.md or log.md, or reviewing repository documentation context. DO NOT USE FOR: syncing the four repo-root docs to a code diff (use docs-sync), session-scoped lessons logs (use lessons-learned), or non-documentation tasks.","version":"1.0.0","argumentHint":"Optional: path under knowledge-base/ to create, edit, or review","path":"skills/open-knowledge/SKILL.md","areas":["ship","shelf"]},{"id":"python-standard","name":"python-standard","description":"Canonical Python coding standard (PEP 8, PEP 257, PEP 484, PEP 20, Google Python Style Guide) for authoring and reviewing Python — every finding cites the rule it violates. USE FOR: writing new Python code, reviewing existing Python code, enforcing project conventions, a style/lint pre-flight before commit, onboarding a Python codebase. DO NOT USE FOR: non-Python languages (use the matching language skill), framework-specific guidance such as Django/FastAPI/Flask, or build/packaging/dependency selection.","version":"1.0.0","argumentHint":"Path to a Python file or module to author, refactor, or review","path":"skills/python-standard/SKILL.md","areas":["build"]},{"id":"taskfile-standard","name":"taskfile-standard","description":"Canonical standard for authoring and reviewing Taskfile.dev v3 task runners (schema, namespacing, caching, composition, security) — every finding cites the rule it violates. USE FOR: writing new Taskfiles, refactoring existing Taskfiles, reviewing a PR that changes `Taskfile.yml` or an included partial, or onboarding a project that uses go-task. DO NOT USE FOR: GNU Make, npm scripts, Just, Mage, or shell-only task runners; or deciding whether to adopt go-task in the first place.","version":"1.0.0","argumentHint":"Path to a `Taskfile.yml` (or included partial) to author, refactor, or review","path":"skills/taskfile-standard/SKILL.md","areas":["build"]},{"id":"thomas","name":"thomas","description":"Hands-on validation skill that refuses to accept any claim that code is \"working\", \"tested\", or \"done\" without personally executing and observing every check. Never assumes, never reasons from probability, and only marks work complete after witnessing passing output first-hand. USE FOR: validating a completed batch, reviewing a pull request, signing off on a release, or pressure-testing any claim that a feature or fix is ready. DO NOT USE FOR: writing code, fixing bugs, making architectural decisions (use code-reviewer for critique), or planning work (use impl-strategy).","version":"1.0.0","argumentHint":"What to validate — batch number, feature name, or file path","path":"skills/thomas/SKILL.md","areas":["verify"]},{"id":"security-and-hardening","name":"security-and-hardening","description":"Hardens code against vulnerabilities. Use when handling user input, authentication, data storage, or external integrations. Use when building any feature that accepts untrusted data, manages user sessions, or interacts with third-party services.","version":"1.0.0","argumentHint":"","path":"skills/security-and-hardening/SKILL.md","areas":["review"]},{"id":"freshness-check","name":"freshness-check","description":"Validate time-sensitive knowledge — library versions, framework defaults, APIs, best practices — against live registries and the current web before acting on it, because trained knowledge lags reality (a model trained on v1.8 will confidently recommend v1.8 when today's standard is v2.5). USE FOR: checking the current version of a library before adding or upgrading a dependency, verifying a remembered API/default/convention is still current, researching what changed between the version you know and today's, resolving any \"is this still the standard?\" doubt. DO NOT USE FOR: testing your own app in a browser (use browser-testing), facts that do not age (algorithms, language fundamentals, project-internal code), or deep multi-source research reports unrelated to staleness.","version":"1.0.0","argumentHint":"Optional: the claim or library to validate (e.g. 'angular', 'npm:zod')","path":"skills/freshness-check/SKILL.md","areas":["shelf"]}],"areas":[{"id":"definition","kind":"phase","step":1,"label":"Definition","description":"Understand the requirement and plan the work before any code is written.","skills":["jira-fetch","grill-me","impl-strategy"]},{"id":"build","kind":"phase","step":2,"label":"Build","description":"Write the code. No orchestrated implementer skill remains — the agent codes directly against these language and task standards.","skills":["angular-components","angular-state","angular-ui","python-standard","dotnet-csharp-standard","taskfile-standard"]},{"id":"verify","kind":"phase","step":3,"label":"Verify","description":"Run every check first-hand; only witnessed passing output counts as done.","skills":["thomas"]},{"id":"review","kind":"phase","step":4,"label":"Review","description":"Critique the change — code health and reasoning — before it ships.","skills":["code-reviewer","security-and-hardening","code-simplification","objective-advisor"]},{"id":"ship","kind":"phase","step":5,"label":"Ship","description":"Sync the docs, then merge and validate against the Definition of Done.","skills":["docs-sync","open-knowledge","merge-and-validate"]},{"id":"shelf","kind":"shelf","step":6,"label":"Shelf","description":"Reference and thinking aids reached into at any stage. Coding standards live under Build; these are stage-agnostic.","skills":["grill-me","open-knowledge","lessons-learned","devcontainer-setup","graphify-setup","browser-testing","freshness-check"]}]};

  if (/jira/.test(id)) return "🎫";

  return "⚔️";
}

const skillById = Object.fromEntries(DATA.skills.map(s => [s.id, s]));
const areaById = Object.fromEntries(DATA.areas.map(a => [a.id, a]));
const phases = DATA.areas.filter(a => a.kind === "phase").sort((a, b) => a.step - b.step);
const shelves = DATA.areas.filter(a => a.kind === "shelf");

let view = { mode: "map" };
let query = "";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function areaColor(a) { return PALETTE[a.id] || "#7c9cff"; }

function statsHtml() {
  const shelfCount = shelves.reduce((n, s) => n + s.skills.length, 0);
  return [
    ["Skills", DATA.skills.length],
    ["Phases", phases.length],
    ["Shelf", shelfCount],
    ["Ver", DATA.version],
  ].map(([k, v]) => '<div class="hudstat"><b>' + v + '</b><span>' + k + '</span></div>').join("");
}

function areaCard(a, kind) {
  const badge = kind === "phase"
    ? '<span class="lv">Step ' + a.step + ' · ' + a.skills.length + ' skill' + (a.skills.length === 1 ? "" : "s") + '</span>'
    : '<span class="lv">' + a.skills.length + ' skills · any stage</span>';
  return '<div class="world" tabindex="0" role="button" data-world="' + a.id + '" style="--wc:' + areaColor(a) + '">'
    + '<div class="rowtop"><div class="sprite">' + (AREA_ICONS[a.id] || "🗺️") + '</div>'
    + '<div><h2>' + esc(a.label || a.id) + '</h2>' + badge + '</div></div>'
    + '<p class="quest">' + esc(a.description || "") + '</p>'
    + '<span class="enter">▸ Enter</span>'
    + '</div>';
}

function abilityCard(skill) {
  return '<div class="ability">'
    + '<div class="rowtop"><div class="icon">' + skillIcon(skill.id) + '</div>'
    + '<h3>' + esc(skill.name) + '</h3><span class="ver">v' + esc(skill.version) + '</span></div>'
    + '<p>' + (esc(skill.description) || "<em>No description.</em>") + '</p>'
    + '<div class="meta"><a class="scroll" href="' + esc(skill.path) + '">Skill.md ↗</a></div>'
    + '</div>';
}

function matches(skill) {
  const q = query.trim().toLowerCase();
  return !q || skill.name.toLowerCase().includes(q)
    || skill.id.toLowerCase().includes(q)
    || skill.description.toLowerCase().includes(q);
}

function render() {
  const screen = document.getElementById("screen");
  const q = query.trim();

  if (q) {
    const hits = DATA.skills.filter(matches);
    screen.innerHTML = '<div class="screen-title">Search results — ' + hits.length + ' skill(s)</div>'
      + (hits.length
        ? '<div class="roster">' + hits.map(abilityCard).join("") + '</div>'
        : '<div class="empty">NO SKILLS FOUND</div>');
    return;
  }

  if (view.mode === "area") {
    const a = areaById[view.id];
    if (!a) { view = { mode: "map" }; return render(); }
    const skills = a.skills.map(id => skillById[id]).filter(Boolean);
    screen.innerHTML = '<button class="back" id="back">◂ Implementation path</button>'
      + '<div class="zonehead" style="--wc:' + areaColor(a) + '">'
      + '<div class="sprite">' + (AREA_ICONS[a.id] || "🗺️") + '</div>'
      + '<h2>' + esc(a.label || a.id) + '</h2><p>' + esc(a.description || "") + '</p></div>'
      + '<div class="roster">' + skills.map(abilityCard).join("") + '</div>';
    return;
  }

  const line = phases.map((a, i) =>
    areaCard(a, "phase") + (i < phases.length - 1 ? '<div class="arrow">▸</div>' : "")
  ).join("");
  screen.innerHTML = '<div class="screen-title">Implementation path — definition ▸ ship</div>'
    + '<div class="pipeline">' + line + '</div>'
    + '<div class="screen-title shelf-title">Shelf — reference &amp; thinking aids, used at any stage</div>'
    + '<div class="worlds">' + shelves.map(a => areaCard(a, "shelf")).join("") + '</div>';
}

document.getElementById("stats").innerHTML = statsHtml();
document.getElementById("screen").addEventListener("click", (e) => {
  const back = e.target.closest("#back");
  if (back) { view = { mode: "map" }; render(); return; }
  const card = e.target.closest(".world[data-world]");
  if (card) { view = { mode: "area", id: card.dataset.world }; render(); window.scrollTo({ top: 0 }); }
});
document.getElementById("screen").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".world[data-world]");
  if (card) { e.preventDefault(); view = { mode: "area", id: card.dataset.world }; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { query = ""; document.getElementById("q").value = ""; view = { mode: "map" }; render(); }
});
document.getElementById("q").addEventListener("input", (e) => { query = e.target.value; render(); });
render();
</script>
</body>
</html>
